services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skysync}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skysync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skysync}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      APP_ENV: production
      LOG_FORMAT: json
    command: ["skysync-migrate"]

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skysync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skysync}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      APP_ENV: production
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      UPLOAD_DIR: /var/lib/skysync/uploads
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-1073741824}
      MAX_CONCURRENT_FILE_TRANSFERS: ${MAX_CONCURRENT_FILE_TRANSFERS:-4}
      FILE_TRANSFER_TIMEOUT_SECONDS: ${FILE_TRANSFER_TIMEOUT_SECONDS:-900}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      TRASH_PURGE_INTERVAL_HOURS: ${TRASH_PURGE_INTERVAL_HOURS:-24}
    volumes:
      - uploads:/var/lib/skysync/uploads
    expose:
      - "3000"

  frontend:
    build:
      context: ../..
      dockerfile: frontend/web/Dockerfile
      args:
        VITE_API_BASE: /api/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads:
