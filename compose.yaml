services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skysync_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skysync}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skysync}:${POSTGRES_PASSWORD:-skysync_dev_password}@db:5432/${POSTGRES_DB:-skysync}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-at-least-32-bytes}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-dev-only-change-this-totp-encryption-key}
      APP_ENV: development
      LOG_FORMAT: text
    command: ["skysync-migrate"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skysync}:${POSTGRES_PASSWORD:-skysync_dev_password}@db:5432/${POSTGRES_DB:-skysync}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-at-least-32-bytes}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-dev-only-change-this-totp-encryption-key}
      APP_ENV: development
      LOG_FORMAT: ${LOG_FORMAT:-text}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${HTTP_PORT:-8080},http://127.0.0.1:${HTTP_PORT:-8080}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      UPLOAD_DIR: /var/lib/skysync/uploads
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-1073741824}
      MAX_CONCURRENT_FILE_TRANSFERS: ${MAX_CONCURRENT_FILE_TRANSFERS:-4}
      FILE_TRANSFER_TIMEOUT_SECONDS: ${FILE_TRANSFER_TIMEOUT_SECONDS:-900}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      TRASH_PURGE_INTERVAL_HOURS: ${TRASH_PURGE_INTERVAL_HOURS:-24}
    volumes:
      - uploads:/var/lib/skysync/uploads
    expose:
      - "3000"

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend/web
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE: /api/
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${HTTP_PORT:-8080}:5173"
    volumes:
      - ./frontend/web:/app/frontend/web
      - frontend_node_modules:/app/frontend/web/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads:
  frontend_node_modules:
